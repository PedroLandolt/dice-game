name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dice
          POSTGRES_PASSWORD: dice
          POSTGRES_DB: dice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dice -d dice"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://dice_app:dice_app@localhost:5432/dice?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Load the schema
        run: psql "postgres://dice:dice@localhost:5432/dice" -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Unit and integration tests with the race detector
        run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run the Postman collection twice
        run: |
          for run in 1 2; do
            npx --yes newman@6 run postman/dice-game.postman_collection.json \
              -e postman/dice-game.postman_environment.json
          done

      - name: Play a round over WebSocket
        run: |
          output=$( (sleep 1; echo "play 500 even"; sleep 1; echo "end"; sleep 1; echo "quit") | go run ./cmd/play )
          echo "$output"
          echo "$output" | grep -q "rolled"
          echo "$output" | grep -q "credited"

      - name: Refuse a WebSocket with an unknown token
        run: |
          if go run ./cmd/play -token not-a-token < /dev/null; then
            exit 1
          fi

      - name: Show the logs
        if: failure()
        run: docker compose logs
