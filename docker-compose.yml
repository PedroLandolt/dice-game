services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dice
      POSTGRES_PASSWORD: dice
      POSTGRES_DB: dice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dice -d dice"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dice_app:dice_app@postgres:5432/dice?sslmode=disable
      DEV_MODE: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
